/* === /coldopen/index.html === */
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Cold Open</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>The Cold Open</h1>
      <p class="subtitle">Your AI-powered improv partner</p>
      <div class="theme-toggle">
        <label class="switch">
          <input type="checkbox" id="theme-switch" />
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Theme</span>
      </div>
    </header>

    <main>
      <div class="format-buttons">
        <button data-format="taboops">🧠 Taboops!</button>
        <button data-format="buzzwords">🧩 Buzzwords & Bullsh*t</button>
        <button data-format="bleep">📕 Fill in the Bleep!</button>
      </div>

      <div class="input-panel">
        <label for="taboo-word">Taboo Word:</label>
        <input type="text" id="taboo-word" placeholder="Enter your taboo word" />

        <label>
          <input type="checkbox" id="after-dark" /> Taboops After Dark 🌒
        </label>
      </div>

      <button id="generate">Generate Scene Start</button>
      <pre id="result"></pre>
      <button id="copy-button">Copy to Clipboard</button>
    </main>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
