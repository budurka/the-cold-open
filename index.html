<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Cold Open</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>The Cold Open</h1>
      <p>An audience-powered premise generator</p>

      <div class="toggle-wrapper">
        <span>🌞 / 🌙</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle" />
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-wrapper">
        <button class="format-button" data-format="Taboops!">🧠 Taboops!</button>
        <button class="format-button" data-format="Buzzwords & Bullsh*t">
          🧩 Buzzwords & Bullsh*t
        </button>
        <button class="format-button" data-format="Fill in the Bleep!">
          📕 Fill in the Bleep!
        </button>
      </div>

      <form id="generator-form">
        <div id="fields-container">
          <!-- Dynamic Fields Injected Here -->
        </div>
        <button type="submit" id="generate">Generate</button>
      </form>

      <div id="result" style="display: none">
        <pre id="result-text"></pre>
        <button class="copy-btn" id="copy-btn">Copy</button>
      </div>

      <p>
        <a href="https://chasebudurka.com">← Back to Chase Budurka</a>
      </p>
    </div>

    <script src="/scripts/index.js"></script>
  </body>
</html>
