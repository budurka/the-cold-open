<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Cold Open</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>The Cold Open</h1>
      <p class="subtitle">Can we get a…</p>
      <div class="theme-toggle">
        <span>🌞 / 🌙</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle" />
          <span class="slider round"></span>
        </label>
      </div>

      <div id="format-buttons">
        <button class="format-button active" data-format="Taboops!">🧠 Taboops!</button>
        <button class="format-button" data-format="Buzzwords & Bullsh*t">🧩 Buzzwords & Bullsh*t</button>
        <button class="format-button" data-format="Fill in the Bleep!">📕 Fill in the Bleep!</button>
      </div>

      <div id="fields-container"></div>

      <button id="generate" class="generate-button">Generate</button>

      <div id="result" class="result-box"></div>

      <a class="back-link" href="https://gemcityvisual.com">← Back to Gem City Visual</a>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
