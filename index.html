<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>The Cold Open</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="scripts.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>The Cold Open</h1>
      <p class="subtitle">Your audience-powered premise partner</p>

      <div class="theme-toggle">
        <span>🌞 / 🌙</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div id="format-buttons">
        <button class="format-button" data-format="Taboops!">🧠 Taboops!</button>
        <button class="format-button" data-format="Buzzwords & Bullsh*t">🧩 Buzzwords & Bullsh*t</button>
        <button class="format-button" data-format="Fill in the Bleep!">📕 Fill in the Bleep!</button>
      </div>

      <div id="fields-container"></div>

      <button id="generate" class="generate-button">Generate</button>

      <div id="result" class="result-box"></div>

      <p><a href="/" class="back-link">← Back to Gem City Visual</a></p>
    </main>
  </body>
</html>
