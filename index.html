<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Cold Open</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>The Cold Open</h1>
    <p>An audience-powered premise generator</p>

    <div class="toggle-wrapper">
      <button id="theme-toggle" aria-label="Toggle Theme" class="theme-button">🌙 / 🌞</button>
    </div>

    <div class="format-selector">
      <button class="format-button active" data-format="Taboops!">🧠 Taboops!</button>
      <button class="format-button" data-format="Buzzwords & Bullsh*t">🧩 Buzzwords & Bullsh*t</button>
      <button class="format-button" data-format="Fill in the Bleep!">📕 Fill in the Bleep!</button>
      <button class="format-button" data-format="What’s in the Box?">🎁 What’s in the Box?</button>
    </div>

    <form id="prompt-form">
      <div id="fields-container">
        <!-- Fields will be dynamically inserted here -->
      </div>
      <button type="submit" id="generate">Generate</button>
    </form>

    <div id="result"></div>

    <a href="https://chasebudurka.com" class="back-link">← Back to ChaseBudurka.com</a>
  </div>

  <script src="scripts.js"></script>
</body>

</html>
