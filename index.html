<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Cold Open • Improv</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1 class="title">The Cold Open</h1>
      <p class="subtitle">Choose a Show</p>
    </header>

    <!-- Wallet / Rolodex -->
    <main class="wallet" id="wallet" aria-label="Show type rolodex">
      <!-- Cards injected by JS -->
    </main>

    <!-- Bottom Dock Nav -->
    <nav class="dock" aria-label="Show shortcuts">
      <button class="dock-btn" data-key="Taboops!" aria-label="Taboops">
        <span class="icon">🚫💬</span><span class="dock-label">Taboops!</span>
      </button>
      <button class="dock-btn" data-key="Buzzwords & Bullsh*t" aria-label="Buzzwords and Nonsense">
        <span class="icon">💬🤪</span><span class="dock-label">Buzzwords</span>
      </button>
      <button class="dock-btn" data-key="Fill in the Bleep!" aria-label="Fill in the Bleep">
        <span class="icon">✏️📄</span><span class="dock-label">Bleep!</span>
      </button>
      <button class="dock-btn" data-key="What’s in the Box?" aria-label="What's in the Box">
        <span class="icon">📦❓</span><span class="dock-label">Box?</span>
      </button>
    </nav>
  </div>

  <!-- Generator Overlay (same page) -->
  <section id="generator" class="generator hidden" role="dialog" aria-modal="true" aria-labelledby="gen-title">
    <div class="gen-card">
      <header class="gen-head">
        <button class="back-btn" id="backBtn" aria-label="Back to show selection">‹</button>
        <h2 id="gen-title" class="gen-title"></h2>
      </header>
      <div class="prompt-card">
        <p id="promptText" class="prompt-text">Tap Generate to create your first prompt.</p>
      </div>
      <div class="gen-actions">
        <button id="copyBtn" class="pill secondary">Copy</button>
        <button id="genBtn" class="pill primary">Generate</button>
      </div>
      <p class="gen-tagline" id="genTag"></p>
    </div>
  </section>

  <script src="scripts.js"></script>
</body>
</html>
