<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Cold Open</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <script>document.documentElement.classList.remove('no-js');</script>
  </head>
  <body>
    <header class="site-header glass">
      <div class="brand">
        <span class="logo">🎭</span>
        <h1>The Cold Open</h1>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="btn ghost" aria-label="Toggle theme" aria-pressed="false">🌗</button>
      </div>
    </header>

    <main class="container">
      <!-- Prompt Controls -->
      <section class="panel glass">
        <h2>Generate a Prompt</h2>

        <div class="control-row">
          <label class="field">
            <span class="label">Format</span>
            <select id="formatSelect">
              <option value="location">Location</option>
              <option value="object">Object</option>
              <option value="profession">Profession</option>
              <option value="relationship">Relationship</option>
              <option value="emotion">Emotion</option>
              <option value="habit">Habit</option>
              <option value="action">Action</option>
              <option value="abstract">Abstract</option>
              <option value="line">Opening Line</option>
              <option value="things">Things You Might Find In A...</option>
            </select>
          </label>

          <label class="field" id="thingsInputWrap" hidden>
            <span class="label">Setting / Place</span>
            <input id="thingsInput" type="text" placeholder="e.g., medieval tavern, dentist’s office" />
          </label>

          <div class="buttons">
            <button id="generateBtn" class="btn primary">Generate</button>
            <button id="saveBtn" class="btn ghost">Save</button>
            <button id="clearBtn" class="btn ghost">Clear</button>
          </div>
        </div>
      </section>

      <!-- Output -->
      <section class="panel glass output">
        <div class="output-meta">
          <h3 id="outputTitle">Your Prompt</h3>
          <div class="output-actions">
            <button id="copyBtn" class="btn">Copy</button>
          </div>
        </div>
        <p id="outputText" class="prompt-text">Tap Generate to get inspired.</p>
      </section>

      <!-- Saved Prompts -->
      <section class="panel glass">
        <div class="section-head">
          <h2>Saved</h2>
          <button id="exportBtn" class="btn">Export</button>
        </div>
        <ul id="savedList" class="saved-list" aria-live="polite"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>Made for improv nerds. Have fun. ✌️</p>
    </footer>

    <script src="scripts.js" defer></script>
  </body>
</html>
