<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Cold Open</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <h1>The Cold Open</h1>
      <div id="theme-toggle" class="theme-toggle">
        <label for="theme-switch">🌞 / 🌙</label>
        <label class="switch">
          <input type="checkbox" id="theme-switch" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <p class="subtitle">Improv fuel for chaotic minds.</p>
    </section>

    <section class="format-selector">
      <div id="format-buttons" class="format-buttons">
        <button data-format="Taboops!">Taboops!</button>
        <button data-format="Buzzwords & Bullsh*t">Buzzwords & Bullsh*t</button>
        <button data-format="Fill in the Bleep!">Fill in the Bleep!</button>
      </div>
    </section>

    <section id="fields-container" class="fields"></section>

    <section>
      <button id="generate" class="button">Generate</button>
      <div id="spinner" class="spinner" style="display: none;">🎭 Generating brilliance…</div>
      <pre id="result" class="result"></pre>
      <button id="copy-button" class="button small" style="display: none;">📋 Copy to Clipboard</button>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <a href="https://gemcityvisual.com" class="footer-link">← Back to Gem City Visual</a>
    </div>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
