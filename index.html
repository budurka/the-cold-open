<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Cold Open</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>The Cold Open</h1>
    <p class="subtitle">An audience-powered premise generator</p>

    <!-- Theme toggle -->
    <div class="theme-toggle">
      <span>🌞 / 🌙</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Format buttons -->
    <div id="format-buttons">
      <button class="format-button active" data-format="Taboops!">🧠 Taboops!</button>
      <button class="format-button" data-format="Buzzwords & Bullsh*t">🧩 Buzzwords & Bullsh*t</button>
      <button class="format-button" data-format="Fill in the Bleep!">📕 Fill in the Bleep!</button>
    </div>

    <!-- Dynamic fields -->
    <div id="fields-container"></div>

    <!-- Generate button -->
    <button id="generate" class="generate-button">Generate</button>

    <!-- Output result -->
    <div id="result" class="result-box"></div>

    <!-- Copy button -->
    <button id="copy-result" class="copy-btn" style="display: none;">Copy to Clipboard</button>

    <!-- Back to site -->
    <div class="back-home">
      <a href="https://chasebudurka.com">
        <button class="home-btn">← Back to ChaseBudurka.com</button>
      </a>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
