<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Cold Open</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>The Cold Open</h1>
    <p>An audience-powered premise generator</p>

    <div class="toggle-wrapper">
      <span>🌞</span>
      <label class="switch">
        <input type="checkbox" id="themeToggle" />
        <span class="slider round"></span>
      </label>
      <span>🌙</span>
    </div>

    <div class="button-group">
      <button class="format-button active" id="taboopsBtn">🧠 Taboops!</button>
      <button class="format-button" id="buzzwordsBtn">🧩 Buzzwords & Bullsh*t</button>
      <button class="format-button" id="bleepBtn">📕 Fill in the Bleep!</button>
    </div>

    <div id="fields-container">
      <!-- Form fields will be injected here -->
    </div>

    <button id="generate">Generate</button>

    <div id="result"></div>
    <a href="https://chasebudurka.com" class="back-link">&larr; Back to ChaseBudurka.com</a>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
