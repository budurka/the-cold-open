<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Cold Open</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>The Cold Open</h1>
    <p class="subtitle">Your AI-powered improv partner</p>

    <div class="toggle-wrapper">
      <label class="theme-label" for="theme-toggle">Theme</label>
      <input type="checkbox" id="theme-toggle" />
    </div>

    <div class="format-buttons">
      <button class="format-button" data-format="taboops">🧠 Taboops!</button>
      <button class="format-button" data-format="buzzwords">🧩 Buzzwords & Bullsh*t</button>
      <button class="format-button" data-format="bleep">📕 Fill in the Bleep!</button>
    </div>

    <div id="fields-container" class="input-panel"></div>

    <div id="after-dark-container" class="after-dark">
      <input type="checkbox" id="after-dark" />
      <label for="after-dark">Taboops After Dark</label>
    </div>

    <button id="generate-btn">Generate Scene Start</button>
    <div id="spinner" style="display:none;">Generating...</div>

    <pre id="result"></pre>

    <button id="copy-button">Copy to Clipboard</button>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
